name: Android Release (signed)

# Builds a signed Release APK on tag push or manual dispatch.
# The Release build is designed to FAIL without the signing secrets (see
# android/app/build.gradle: buildTypes.release throws when MYAPP_RELEASE_*
# are absent), so we can never accidentally ship a debug-signed artifact.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    env:
      # --- Required GitHub Actions secrets -----------------------------------
      # MYAPP_RELEASE_STORE_FILE_B64 : base64 of your .keystore  (base64 -w0 release.keystore)
      # MYAPP_RELEASE_KEY_ALIAS      : key alias inside the keystore
      # MYAPP_RELEASE_STORE_PASSWORD : keystore password
      # MYAPP_RELEASE_KEY_PASSWORD   : key password
      MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.MYAPP_RELEASE_KEY_ALIAS }}
      MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.MYAPP_RELEASE_STORE_PASSWORD }}
      MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.MYAPP_RELEASE_KEY_PASSWORD }}
      # Decoded keystore path is set at runtime (see "Decode release keystore"
      # step) into $RUNNER_TEMP and exported to $GITHUB_ENV. It lives ONLY in
      # the runner temp dir and is deleted at the end of the job (see
      # "Cleanup keystore"). It is never committed, never printed, and never
      # uploaded as an artifact.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies (lockfile)
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      # Gate: tsc + notify tests + crypto/secure tests + static security gate.
      # This must be green before we are allowed to ship a signed build.
      - name: Run verification gate (tsc + tests + security gate)
        run: npm run verify

      - name: Decode release keystore into runner temp
        run: |
          echo "${{ secrets.MYAPP_RELEASE_STORE_FILE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MYAPP_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK signature is NOT the debug certificate
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK" >&2
            exit 1
          fi
          echo "=== apksigner verify --verbose --print-certs ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" \
              | grep -Ei "Android Debug|androiddebugkey"; then
            echo "ERROR: APK is signed with the DEBUG certificate! Refusing to publish." >&2
            exit 1
          fi
          echo "OK: APK is signed with the official release keystore (no debug cert)."

      - name: Determine app version
        id: appver
        run: |
          VER=$(grep -oE 'versionName "[0-9]+\.[0-9]+\.[0-9]+"' android/app/build.gradle \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/life-workbench-${{ steps.appver.outputs.version }}-release.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: life-workbench-release-${{ steps.appver.outputs.version }}
          path: android/app/build/outputs/apk/release/life-workbench-${{ steps.appver.outputs.version }}-release.apk

      # Defense in depth: remove the decoded keystore from the runner so it is
      # never left on disk or swept into a later step / artifact.
      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" || true

# Notes:
# - Native modules (e.g. expo-crypto added for the security hardening) are
#   resolved at build time via expo-modules-autolinking from node_modules, so no
#   `npx expo prebuild` step is required here.
# - Secrets (keystore b64, alias, passwords) are never printed; they live only
#   in GitHub Actions secrets and are written solely to the runner temp dir.
